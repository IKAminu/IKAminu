name: Fix article navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[article-nav-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_article_nav.py
      - name: Validate
        run: |
          ! grep -q "onBack" src/why-marketing-is-really-a-systems-problem.tsx
          grep -q "goToWriting" src/why-marketing-is-really-a-systems-problem.tsx
          grep -q "goToCybersecurity" src/why-marketing-is-really-a-systems-problem.tsx
          grep -q "goToHiddenCost" src/Cybersecurity_is_mostly_human_design.tsx
          grep -q "pt-32" src/Cybersecurity_is_mostly_human_design.tsx
          grep -q "goToWriting" src/the-hidden-cost-of-poor-business-systems.tsx
      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/why-marketing-is-really-a-systems-problem.tsx src/Cybersecurity_is_mostly_human_design.tsx src/the-hidden-cost-of-poor-business-systems.tsx
          git rm scripts/fix_article_nav.py
          git rm .github/workflows/fix-article-navigation.yml
          git commit -m "Fix article navigation and spacing [article-nav-final]"
          git push