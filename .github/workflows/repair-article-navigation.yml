name: Repair article navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[article-navigation-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply article navigation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()

          old = """  useEffect(() => {\n    window.scrollTo({ top: 0, behavior: 'instant' })\n  }, [currentPage])\n\nconst renderPage = () => {"""
          new = """  useEffect(() => {\n    window.scrollTo({ top: 0, behavior: 'instant' })\n  }, [currentPage])\n\n  // Allow article components to navigate through the same React page state as the main navigation.\n  // This avoids fragile DOM button clicks and keeps all article navigation inside the SPA.\n  useEffect(() => {\n    const handleSiteNavigation = (event: Event) => {\n      const page = (event as CustomEvent<Page>).detail\n      if (page) setCurrentPage(page)\n    }\n\n    window.addEventListener('site:navigate', handleSiteNavigation)\n    return () => window.removeEventListener('site:navigate', handleSiteNavigation)\n  }, [])\n\nconst renderPage = () => {"""
          if old not in s:
              raise SystemExit('App navigation effect insertion point not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label} not found in {path}')
              p.write_text(text.replace(old, new, 1))

          article = Path('src/why-marketing-is-really-a-systems-problem.tsx')
          s = article.read_text()
          old = """  const goToWriting = () => {\n    const button = Array.from(document.querySelectorAll('button')).find(\n      (el) => el.textContent?.trim() === 'Writing'\n    ) as HTMLButtonElement | undefined\n    button?.click()\n  }\n\n  const goToCybersecurity = () => {\n    goToWriting()\n    window.setTimeout(() => {\n      const button = Array.from(document.querySelectorAll('button')).find(\n        (el) => el.textContent?.includes('Cybersecurity is mostly human design')\n      ) as HTMLButtonElement | undefined\n      button?.click()\n    }, 100)\n  }"""
          new = """  const navigate = (page: 'writing' | 'cybersecurity-is-mostly-human-design') => {\n    window.dispatchEvent(new CustomEvent('site:navigate', { detail: page }))\n  }\n\n  const goToWriting = () => navigate('writing')\n  const goToCybersecurity = () => navigate('cybersecurity-is-mostly-human-design')"""
          if old not in s:
              raise SystemExit('Marketing navigation functions not found')
          s = s.replace(old, new, 1)
          old = "Marketing Systems By IK Aminu"
          new = "Marketing · Systems · By IK Aminu"
          if old not in s:
              raise SystemExit('Marketing metadata label not found')
          s = s.replace(old, new, 1)
          article.write_text(s)

          article = Path('src/Cybersecurity_is_mostly_human_design.tsx')
          s = article.read_text()
          old = """  const goToWriting = () => {\n    const button = Array.from(document.querySelectorAll('button')).find(\n      (el) => el.textContent?.trim() === 'Writing'\n    ) as HTMLButtonElement | undefined\n    button?.click()\n  }\n\n  const goToHiddenCost = () => {\n    goToWriting()\n    window.setTimeout(() => {\n      const button = Array.from(document.querySelectorAll('button')).find(\n        (el) => el.textContent?.includes('The Hidden Cost of Poor Business Systems')\n      ) as HTMLButtonElement | undefined\n      button?.click()\n    }, 100)\n  }"""
          new = """  const navigate = (page: 'writing' | 'hidden-cost-of-poor-business-systems') => {\n    window.dispatchEvent(new CustomEvent('site:navigate', { detail: page }))\n  }\n\n  const goToWriting = () => navigate('writing')\n  const goToHiddenCost = () => navigate('hidden-cost-of-poor-business-systems')"""
          if old not in s:
              raise SystemExit('Cybersecurity navigation functions not found')
          s = s.replace(old, new, 1)
          s = s.replace("pt-32 pb-20", "pt-44 pb-20", 1)
          article.write_text(s)

          article = Path('src/the-hidden-cost-of-poor-business-systems.tsx')
          s = article.read_text()
          old = """  const goToWriting = () => {\n    const button = Array.from(document.querySelectorAll('button')).find(\n      (el) => el.textContent?.trim() === 'Writing'\n    ) as HTMLButtonElement | undefined\n    button?.click()\n  }"""
          new = """  const navigate = (page: 'writing' | 'competence-is-designed') => {\n    window.dispatchEvent(new CustomEvent('site:navigate', { detail: page }))\n  }\n\n  const goToWriting = () => navigate('writing')\n  const goToNextArticle = () => navigate('competence-is-designed')"""
          if old not in s:
              raise SystemExit('Hidden Cost navigation function not found')
          s = s.replace(old, new, 1)
          marker = """      </div>\n    </article>\n  )\n}"""
          footer = """      </div>\n\n      <footer style={{ marginTop: '80px', paddingTop: '40px', borderTop: '1px solid rgba(237, 232, 225, 0.08)' }}>\n        <div style={{ fontFamily: \"'DM Sans', system-ui, sans-serif\", fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', color: '#7a7772', marginBottom: '16px' }}>\n          Up Next\n        </div>\n        <button\n          type=\"button\"\n          onClick={goToNextArticle}\n          style={{ display: 'block', width: '100%', textAlign: 'left', background: '#111111', border: '1px solid rgba(237, 232, 225, 0.08)', padding: '28px', cursor: 'pointer', color: '#ede8e1' }}\n        >\n          <span style={{ fontFamily: \"'DM Sans', system-ui, sans-serif\", fontSize: '11px', color: '#16a374', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Next Essay</span>\n          <h3 style={{ fontFamily: \"'Gloock', Georgia, serif\", fontSize: '22px', margin: '8px 0', fontWeight: 400 }}>Competence Is Designed →</h3>\n          <p style={{ fontFamily: \"'DM Sans', system-ui, sans-serif\", fontSize: '14px', color: '#a09b96', margin: 0 }}>Consistent performance is built through systems, feedback, and deliberate constraints.</p>\n        </button>\n      </footer>\n    </article>\n  )\n}"""
          if marker not in s:
              raise SystemExit('Hidden Cost article closing marker not found')
          s = s.replace(marker, footer, 1)
          article.write_text(s)

          # Validate the actual source files before committing.
          checks = [
              ('src/App.tsx', "window.addEventListener('site:navigate', handleSiteNavigation)"),
              ('src/why-marketing-is-really-a-systems-problem.tsx', "new CustomEvent('site:navigate', { detail: page })"),
              ('src/Cybersecurity_is_mostly_human_design.tsx', "navigate('hidden-cost-of-poor-business-systems')"),
              ('src/the-hidden-cost-of-poor-business-systems.tsx', "navigate('competence-is-designed')"),
          ]
          for filename, needle in checks:
              text = Path(filename).read_text()
              if needle not in text:
                  raise SystemExit(f'Validation failed: {needle} missing from {filename}')

          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/App.tsx', 'src/why-marketing-is-really-a-systems-problem.tsx', 'src/Cybersecurity_is_mostly_human_design.tsx', 'src/the-hidden-cost-of-poor-business-systems.tsx'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Fix article navigation and spacing [article-navigation-repair]'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY

      - name: Remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-article-navigation.yml
          git commit -m "Remove temporary article repair workflow [article-navigation-repair]"
          git push
